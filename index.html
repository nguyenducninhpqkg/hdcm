<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HĐCM 2026-2027</title>
<meta name="theme-color" content="#1f3f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HĐCM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--do:#1f3f8f;--nen:#fff;--chu:#1d2a44}
  html,body{margin:0;height:100%;background:var(--nen);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--chu)}
  #web{position:fixed;inset:0;width:100%;height:100%;border:0;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #cho{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--nen);transition:opacity .3s}
  #cho.an{opacity:0;pointer-events:none}
  #cho img{width:360px;height:360px;border-radius:50%}
  #cho p{margin:0;font-size:14px;color:#5b6577}
  #cho a{display:none;font-size:14px;color:var(--do)}
  #cho.lau a{display:block}
</style>
</head>
<body>
<iframe id="web" title="HĐCM 2026-2027" allow="clipboard-write"></iframe>
<div id="cho"><img src="icon-192.png" alt=""><p>Đang mở HĐCM…</p>
  <a id="moNgoai" target="_blank" rel="noopener">Mạng chậm? Bấm để mở bằng trình duyệt</a></div>
<script>
// Vỏ app: chỉ nhúng web HĐCM (Apps Script) vào toàn màn hình. Mọi dữ liệu, đăng nhập, quyền vẫn ở web gốc.
var WEB_URL = 'https://script.google.com/macros/s/AKfycbwYZCLoldvn80jR2R9ZKLyfAbMa9z_FCQ39BTseukgGpcy_Ua7tV6iP0zTMyP3KWXQ/exec';
var KHOA = 'hdcm_app_tk';      // phiên đăng nhập giữ ở vỏ app (iPhone hay xóa bộ nhớ của trang nhúng)
var web = document.getElementById('web'), cho = document.getElementById('cho');
document.getElementById('moNgoai').href = WEB_URL;
// iPhone/iPad: Safari (và mọi trình duyệt trên iPhone) chặn cookie Google khi trang bị nhúng → lỗi 401.
// Nên trên iPhone/iPad, app chuyển thẳng sang link web gốc thay vì nhúng.
var LA_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (LA_IOS) { document.querySelector('#cho p').textContent = 'Đang mở HĐCM…'; location.replace(WEB_URL); }
else web.src = WEB_URL;
web.addEventListener('load', function(){ setTimeout(function(){ cho.className = 'an'; }, 600); });
setTimeout(function(){ if(cho.className !== 'an') cho.className = 'lau'; }, 12000);

// Trao đổi phiên đăng nhập với trang web bên trong (chỉ nhận/gửi cho trang của Google Apps Script)
function laGoogle(o){ return /^https:\/\/[a-z0-9-]+\.script\.googleusercontent\.com$/.test(o) || o === 'https://script.google.com'; }
window.addEventListener('message', function(e){
  if(!laGoogle(e.origin) || !e.data || typeof e.data !== 'object' || e.data.hdcm == null) return;
  var d = e.data, tk = null;
  try { tk = localStorage.getItem(KHOA); } catch(x){}
  if(d.hdcm === 'xinTK') e.source.postMessage({hdcm:'traTK', tk: tk || ''}, e.origin);
  else if(d.hdcm === 'luuTK'){ try { if(d.tk) localStorage.setItem(KHOA, String(d.tk)); else localStorage.removeItem(KHOA); } catch(x){} }
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
